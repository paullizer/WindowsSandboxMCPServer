name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-checks:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: python -m pip install .

      - name: Check installed resources
        shell: pwsh
        run: |
          Push-Location $env:RUNNER_TEMP
          try {
            python -c "from sandbox_mcp.config import Settings; s = Settings.from_env(); assert s.payload_dir and (s.payload_dir / 'bootstrap.ps1').is_file(); assert s.storyboard_dir and (s.storyboard_dir / 'values.example.json').is_file()"
          } finally {
            Pop-Location
          }

      - name: Compile Python
        run: python -m compileall -q src tests

      - name: Run host-only checks
        run: |
          python -W error tests/check_config.py
          python -W error tests/check_storyboard.py
          python -W error tests/check_prompter.py

      - name: Parse PowerShell payloads
        shell: pwsh
        run: |
          $parseErrors = foreach ($file in Get-ChildItem payload -Recurse -Filter *.ps1) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            foreach ($error in $errors) {
              "$($file.FullName): $($error.Message)"
            }
          }
          if ($parseErrors) {
            $parseErrors | Write-Error
            exit 1
          }
