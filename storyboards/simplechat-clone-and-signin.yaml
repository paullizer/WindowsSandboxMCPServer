name: simplechat-clone-and-signin
description: >
  Clone microsoft/simplechat and sign in to both Azure CLIs. Suspends twice for device-code
  sign-in, because the sandbox image has no browser to redirect to.

  Assumes the prerequisites are installed - `include: prereqs-from-clean-windows` first, or run
  that storyboard beforehand. Reusable by any storyboard that needs an authenticated checkout.

defaults:
  beat: 0.8

steps:
  - run_in_guest:
      command: >-
        & C:\payload\clone-simplechat.ps1
        -Repo "{{simplechat.repository}}"
        -Commit "{{simplechat.commit}}"
      visible: true
      timeout: 900
      say: >-
        Next we pull down simplechat itself, straight from the public Microsoft repository. Nothing
        is pre-staged here - this is the same clone anybody watching would do.
      say_after: >-
        That's the repository, pinned to a specific commit so you know exactly what got deployed.
        The part that matters is the deployers folder, because that's where the azd project lives -
        not at the repository root, which catches people out.

  - await_guest: { marker: simplechat_cloned, timeout: 60 }
  - beat: { seconds: 3.0, reason: "show the clone landed" }

  - run_in_guest:
      command: 'cd C:\simplechat\deployers; az login --use-device-code'
      visible: true
      await_exit: false
      timeout: 60
      say: >-
        Now we sign in to Azure, and here the sandbox forces an honest choice. Normally the Azure
        CLI opens a browser - but there is no browser in here at all. So we use device code sign-in
        instead: the sandbox prints a short code and we enter it somewhere else. It's the safer
        pattern anyway, because no password is ever typed into this machine or caught on camera.

  - beat: { seconds: 10.0, reason: "let the device code render" }

  - await_operator:
      message: >-
        Read the device code from the guest screen below, open https://login.microsoft.com/device on
        the host, sign in, and wait for the guest console to return to a prompt. Then resume.
      log_tail: 30
      say: >-
        There's the code. We'll go and enter that, and come back once Azure has accepted it.

  - run_in_guest:
      command: 'azd auth login --use-device-code'
      visible: true
      await_exit: false
      timeout: 60
      say: >-
        We have to do that twice, which surprises people. The Azure CLI and the Azure Developer CLI
        keep separate credentials. azd is what runs the deployment; the CLI is what the deployment's
        own scripts call for things like the container build. Signing into one does not sign you
        into the other.

  - beat: { seconds: 6.0, reason: "let azd print its code" }

  # azd prints the code and then waits on a keypress before it starts polling, assuming it can open
  # a browser. Nothing happens until this is sent.
  - answer_guest:
      expect: "press enter and continue"
      keys: ["enter"]
      timeout: 120

  - beat: { seconds: 4.0, reason: "azd starts polling" }

  - await_operator:
      message: >-
        Same again for azd: enter the second device code at https://microsoft.com/devicelogin, wait
        for the prompt, then resume.
      log_tail: 30
      say: >-
        Second code, same routine.
