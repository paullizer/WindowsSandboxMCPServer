name: prereqs-from-clean-windows
description: >
  Take a bare Windows Sandbox and install the toolchain an Azure deployment needs: git, Python 3.12,
  PowerShell 7, the Azure CLI and the Azure Developer CLI. Shows the machine is genuinely empty
  first, then proves it afterwards.

  Reusable on its own, or with `include: prereqs-from-clean-windows` at the top of another
  storyboard. Takes about ten to twelve minutes.

defaults:
  beat: 0.8

steps:
  - await_desktop:
      timeout: 300
      say: >-
        What you're looking at is a Windows Sandbox - a throwaway virtual machine Windows builds
        from scratch every time you open it. Nothing we do here touches the host, and when we close
        it, all of it disappears. That's exactly what we want for a deployment walkthrough, because
        it means nothing already on my machine can quietly make this work.

  - beat: { seconds: 2.5, reason: "let the clean desktop land" }
  - focus_sandbox:

  - run_in_guest:
      command: >-
        Write-Host "Clean Windows Sandbox - checking for deployment tools..." -ForegroundColor Cyan;
        foreach ($t in 'git','python','az','azd','pwsh') {
        $f = Get-Command $t -ErrorAction SilentlyContinue;
        if ($f) { Write-Host "  $t : $($f.Source)" -ForegroundColor Green }
        else { Write-Host "  $t : NOT INSTALLED" -ForegroundColor Red } }
      visible: true
      timeout: 120
      say: >-
        Before we do anything, let's prove the machine really is empty. We're asking Windows
        whether it can find the five tools this deployment needs.
      say_after: >-
        Every one of them missing. No git, no Python, no Azure CLI, no azd, and only the old
        Windows PowerShell. This is genuinely a blank machine, and it's worth pausing on, because
        everything from here has to be earned.

  - beat: { seconds: 4.0, reason: "let the empty toolchain sink in" }

  - run_in_guest:
      command: '& C:\payload\install-prereqs.ps1'
      visible: true
      timeout: 1800
      say: >-
        Now we install what the deployment actually asks for: the Azure CLI, the Azure Developer
        CLI, Python 3.12, PowerShell 7 - and git, just to get the code. There's a catch though. The
        sandbox has no Microsoft Store, no winget, and no browser at all, so we can't download
        things the usual way. Everything here is fetched directly and installed silently. This
        takes about ten minutes, so let it run.
      say_after: >-
        There's the whole toolchain, with versions. One thing worth calling out: Python here isn't
        the installer from python.org. That one hangs indefinitely inside the sandbox, with or
        without elevation. This is a standalone build we simply unpack, which takes about a second
        instead of never finishing.

  - await_guest: { marker: prereqs_installed, timeout: 60 }
  - beat: { seconds: 3.0, reason: "read the installed versions" }

  - run_in_guest:
      command: >-
        Write-Host "Same machine, after installing prerequisites:" -ForegroundColor Cyan;
        foreach ($t in 'git','python','az','azd','pwsh') {
        $f = Get-Command $t -ErrorAction SilentlyContinue;
        if ($f) { Write-Host "  $t : $($f.Source)" -ForegroundColor Green }
        else { Write-Host "  $t : NOT INSTALLED" -ForegroundColor Red } }
      visible: true
      timeout: 120
      say: >-
        Let's run that same check again, so you can see the before and after side by side.
      say_after: >-
        All five, all green, on a machine that had none of them a few minutes ago.

  - beat: { seconds: 4.0, reason: "hold on the before/after" }
