name: simplechat-azd-deploy
description: >
  Deploy SimpleChat to Azure with `azd up`, with every choice seeded up front so the deployment
  runs start to finish without stopping to ask anything. This is the repeatable,
  automation-friendly path; see simplechat-azd-deploy-prompted for the version that answers azd's
  questions live and talks through what each one means.

  Composed from prereqs-from-clean-windows and simplechat-clone-and-signin, so it runs against a
  bare sandbox. Drop those two includes to run only the deployment against a prepared one.

  Copy values.example.json to values.json and fill in the Azure and SimpleChat values before
  replaying. Resource naming derives from `automated_environment`, so use a unique value for every
  deployment.

agenda:
  title: Deploying SimpleChat to Azure from a clean Windows machine
  subtitle: Prerequisites, code, sign-in and a single deployment command

defaults:
  beat: 0.8

setup:
  # The closing shot opens the deployed site, and the sandbox image has no browser at all. Off
  # camera, before the recording starts - nobody needs to watch a browser install.
  - run_in_guest:
      command: '& C:\payload\install-edge.ps1'
      visible: false
      timeout: 1200

steps:
  - include: prereqs-from-clean-windows
  - include: simplechat-clone-and-signin

  # --- azd environment ----------------------------------------------------------
  # Must come before the Entra script: that script ends by writing the app registration into the
  # azd environment with `azd env set`, which hangs on a prompt if the environment does not exist.
  - run_in_guest:
      chapter: Choose the deployment
      command: >-
        & C:\payload\configure-azd-env.ps1
        -EnvName "{{simplechat.automated_environment}}"
        -SubscriptionId "{{azure.subscription_id}}"
        -Location "{{azure.location}}"
        -AppName "{{simplechat.app_name}}"
        -AuthenticationType "{{simplechat.authentication_type}}"
        -RedisAuthenticationType "{{simplechat.redis_authentication_type}}"
        -ConfigureApplicationPermissions "{{simplechat.configure_application_permissions}}"
        -DeployContentSafety "{{simplechat.deploy_content_safety}}"
        -DeployRedisCache "{{simplechat.deploy_redis_cache}}"
        -DeploySpeechService "{{simplechat.deploy_speech_service}}"
        -DeployVideoIndexerService "{{simplechat.deploy_video_indexer_service}}"
        -EnableDiagLogging "{{simplechat.enable_diag_logging}}"
        -EnablePrivateNetworking "{{simplechat.enable_private_networking}}"
        -OpenAIDeploymentType "{{simplechat.openai_deployment_type}}"
      visible: true
      timeout: 600
      say: >-
        The machine is ready, so now we decide what we're actually deploying. Which subscription,
        which region, and every option SimpleChat gives you - Content Safety, Redis, Speech, Video
        Indexer, diagnostics, private networking, and how the model capacity is bought. We're
        feeding all of it in up front rather than answering prompts as they come. That's
        deliberate: it makes the deployment repeatable, and it means the run can't stall on a
        question nobody is there to answer.
      say_after: >-
        Those are the choices, and they're the whole shape of the deployment. Change them and the
        same command builds you something different.

  - await_guest: { marker: azd_env_ready, timeout: 60 }
  - beat: { seconds: 4.0, reason: "read the seeded parameters" }

  # --- Entra app registration ---------------------------------------------------
  - run_in_guest:
      chapter: Register the application
      command: >-
        cd C:\simplechat\deployers;
        pwsh -NoProfile -File .\Initialize-EntraApplication.ps1
        -AppName "{{simplechat.app_name}}"
        -Environment "{{simplechat.automated_environment}}"
        -AppRolesJsonPath ./azurecli/appRegistrationRoles.json
      visible: true
      timeout: 1200
      say: >-
        SimpleChat also needs an identity in Entra ID - an app registration. That's how people will
        sign in to the finished app, and how the app is allowed to look up users and groups so it
        can decide who sees what. This script creates it, grants the Graph permissions, mints a
        secret and hands all of it to azd.
      say_after: >-
        That's the app registration created and wired into the deployment environment.

  - beat: { seconds: 4.0, reason: "show the app registration result" }

  # --- deploy -------------------------------------------------------------------
  - run_in_guest:
      chapter: Deploy
      command: '& C:\payload\deploy-azd.ps1'
      visible: true
      timeout: 4200
      say: >-
        And this is the moment - one command that builds the whole thing. It provisions the
        infrastructure and then builds and ships the application. Most of it is quick: the web app,
        the database, the search index and the AI services are up within a few minutes. Redis is
        the outlier, and on its own it can take twenty to forty minutes, so expect somewhere
        between half an hour and an hour overall and don't panic at the quiet part in the middle.
      say_after: >-
        That's the deployment finished - the resource group, the web app, the databases, the AI
        services and the application itself, all from a single command on a machine that started
        with nothing.

  - beat: { seconds: 6.0, reason: "hold on the deployment summary" }

  - run_in_guest:
      chapter: Check what we deployed
      task: Everything in the resource group
      command: >-
        Clear-Host; cd C:\simplechat\deployers;
        $rg = (azd env get-values | Where-Object { $_ -like 'AZURE_RESOURCE_GROUP=*' }) -replace '^[^=]+=|"', '';
        Write-Host "Resource group: $rg" -ForegroundColor Cyan;
        az resource list --resource-group $rg --query "sort_by([].{name:name, type:type}, &type)" -o table
      visible: true
      timeout: 300
      say: >-
        Let's check it properly. This is everything azd created, in the one resource group it made
        for this environment.
      say_after: >-
        If you ever want to take this deployment away, that's one resource group to delete.

  - beat: { seconds: 5.0, reason: "read the resource list" }

  - run_in_guest:
      task: Open the running app
      command: '& C:\payload\open-simplechat.ps1'
      visible: true
      timeout: 300
      say: >-
        And the check that actually counts - does the site come up?
      say_after: >-
        There's the running application. Start to finish on a machine that had no tools, no code
        and no credentials - and when we close this sandbox, every trace of it is gone.

  - beat: { seconds: 10.0, reason: "hold the closing shot on the running site" }
